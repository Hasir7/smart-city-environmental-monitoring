apiVersion: apps/v1
kind: Deployment
metadata:
  name: secrets-sync
  namespace: smart-city
spec:
  replicas: 1
  selector:
    matchLabels: { app: secrets-sync }
  template:
    metadata:
      labels: { app: secrets-sync }
    spec:
      containers:
        - name: secrets-sync
          image: registry.k8s.io/pause:3.10
          volumeMounts:
            - name: secrets-store
              mountPath: /mnt/secrets-store
              readOnly: true
      volumes:
        - name: secrets-store
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: smart-city-key-vault
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rabbitmq
  namespace: smart-city
spec:
  replicas: 1
  selector:
    matchLabels: { app: rabbitmq }
  template:
    metadata:
      labels: { app: rabbitmq }
    spec:
      containers:
        - name: rabbitmq
          image: rabbitmq:3.13-management-alpine
          ports:
            - { name: amqp, containerPort: 5672 }
            - { name: management, containerPort: 15672 }
          envFrom:
            - secretRef: { name: smart-city-secrets }
          readinessProbe:
            exec: { command: ["rabbitmq-diagnostics", "-q", "ping"] }
            initialDelaySeconds: 15
            timeoutSeconds: 10
            periodSeconds: 10
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: 500m, memory: 512Mi }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ingestion
  namespace: smart-city
spec:
  replicas: 1
  selector:
    matchLabels: { app: ingestion }
  template:
    metadata:
      labels: { app: ingestion }
    spec:
      containers:
        - name: ingestion
          image: ACR_LOGIN_SERVER/ingestion:IMAGE_TAG
          imagePullPolicy: Always
          ports:
            - { name: http, containerPort: 8001 }
          envFrom:
            - configMapRef: { name: smart-city-config }
            - secretRef: { name: smart-city-secrets }
          readinessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests: { cpu: 50m, memory: 96Mi }
            limits: { cpu: 300m, memory: 256Mi }
---
