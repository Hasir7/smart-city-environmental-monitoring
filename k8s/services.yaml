apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
  namespace: smart-city
spec:
  selector: { app: rabbitmq }
  ports:
    - { name: amqp, port: 5672, targetPort: 5672 }
    - { name: management, port: 15672, targetPort: 15672 }
---
apiVersion: v1
kind: Service
metadata:
  name: ingestion
  namespace: smart-city
spec:
  selector: { app: ingestion }
  ports:
    - { name: http, port: 8001, targetPort: 8001 }
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: smart-city
spec:
  selector: { app: api }
  ports:
    - { name: http, port: 8000, targetPort: 8000 }
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: smart-city
  annotations:
    service.beta.kubernetes.io/azure-dns-label-name: smartcityproject
spec:
  type: LoadBalancer
  selector: { app: frontend }
  ports:
    - { name: http, port: 80, targetPort: 80 }
